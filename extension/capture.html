<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threadkeep Capture</title><link rel="stylesheet" href="capture.css"></head><body><main>
<header><a id="open-app" href="https://haiduy2405.github.io/threadkeep/" target="_blank" rel="noopener">threadkeep <small>CAPTURE BETA</small></a><select id="language" aria-label="Language / Ngôn ngữ"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></header>
<h1 data-text="Save straight to Threadkeep">Save straight to Threadkeep</h1><p id="source"></p><p class="notice" data-text="This beta saves rendered text, not hidden branches or media files. Whole-account coverage is not verified."></p>
<p id="provider-warning" class="notice" hidden data-text="Some DeepSeek/Grok layouts may be unsupported. If capture stops, keep JSON import as a fallback."></p>
<label for="account" data-text="Account label (set a different label for each account)"></label><input id="account" maxlength="64" placeholder="Personal / Work"><p class="muted" data-text="The label is your own identifier, not a verified account connection. Do not switch provider accounts during a capture."></p>
<label id="local-consent-row" hidden><input id="local-consent" type="checkbox"><span data-text="I confirm this tab is my local Open WebUI and want to enable capture for it."></span></label><p id="local-disclaimer" class="notice" hidden data-text="Local capture is optional and limited to the Open WebUI page on localhost / 127.0.0.1. Ollama and LM Studio API endpoints do not provide this chat-history integration."></p>
<div class="choices"><button id="save-one" data-text="Save current conversation"></button><button id="scan" data-text="Find conversations to save"></button></div>
<p class="muted" data-text="Finding history asks permission only for the selected AI site. A separate helper tab reads selected conversations; your original tab stays open."></p>
<section id="history" hidden><h2 data-text="Choose conversations"></h2><p id="coverage"></p><div class="selection"><label><input id="select-all" type="checkbox"><span data-text="Select all discovered"></span></label><input id="search" type="search" aria-label="Filter discovered conversations"><button id="save-selected" data-text="Save selected conversations"></button></div><p data-text="Maximum 100 conversations and 8 MB per batch. Larger histories need several batches."></p><div id="items"></div></section>
<div class="progress"><p id="status" role="status" aria-live="polite"></p><button id="cancel" hidden data-text="Stop after this conversation"></button></div><ul id="errors"></ul><p class="muted" data-text="Saved content is sent locally to the Threadkeep tab for your review. No passwords or cookies are collected."></p>
<button id="pending" hidden data-text="Review pending capture in Threadkeep"></button>
</main><script type="module" src="capture-ui.js"></script></body></html>
